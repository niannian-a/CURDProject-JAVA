<!DOCTYPE html>
<html lang="zh-CN"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>用户注册</title>
</head>
<body>

<h1>用户注册</h1>

<p th:if="${error}"
   th:text="${error}"
   style="color: red;"></p>

<form action="/register" method="post">
    <div>
        <label for="username">用户名：</label>
        <input id="username"
               name="username"
               type="text"
               required>
    </div>
    <div>
        <label for="name">名字：</label>
        <input id="name"
               name="name"
               type="text"
               required>
    </div>
    <div>
        <label for="password">密码：</label>
        <input id="password"
               name="password"
               type="password"
               required>
    </div>

    <button type="submit">注册</button>
</form>

<p>
    已有账号？
    <a href="/login">前往登录</a>
</p>

</body>
</html>
