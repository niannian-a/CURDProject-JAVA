<!DOCTYPE html>
<html lang="zh-CN"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>用户登录</title>
</head>
<body>

<h1>用户登录</h1>

<p th:if="${error}"
   th:text="${error}"
   style="color: red;"></p>

<form action="/login" method="post">
    <div>
        <label for="username">用户名：</label>
        <input id="username"
               name="username"
               type="text"
               required>
    </div>

    <div>
        <label for="password">密码：</label>
        <input id="password"
               name="password"
               type="password"
               required>
    </div>

    <button type="submit">登录</button>
</form>

<p>
    没有账号？
    <a href="/register">立即注册</a>
</p>

</body>
</html>
