<!DOCTYPE html>
<html lang="zh-CN"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>用户管理</title>

    <style>
        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, "Microsoft YaHei", sans-serif;
            background-color: #f5f7fa;
            color: #333;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 30px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
        }

        .header h1 {
            margin: 0;
            font-size: 26px;
        }

        .login-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 13px;
            border: 1px solid #ddd;
            text-align: center;
        }

        th {
            background-color: #00796b;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f8f8f8;
        }

        tr:hover {
            background-color: #eef7f5;
        }

        .button {
            display: inline-block;
            padding: 7px 14px;
            border: none;
            border-radius: 4px;
            color: white;
            text-decoration: none;
            cursor: pointer;
            font-size: 14px;
        }

        .edit-button {
            background-color: #1976d2;
        }

        .edit-button:hover {
            background-color: #125ea8;
        }

        .add-button {
            background-color: #a5d6a7;
        }

        .add-button:hover {
            background-color: #a5d6a7;
        }

        .delete-button {
            background-color: #d32f2f;
        }

        .delete-button:hover {
            background-color: #a92323;
        }

        .logout-button {
            background-color: #666;
        }

        .message {
            padding: 12px;
            margin-bottom: 18px;
            border-radius: 5px;
        }

        .success-message {
            color: #1b5e20;
            background-color: #e8f5e9;
            border: 1px solid #a5d6a7;
        }

        .error-message {
            color: #b71c1c;
            background-color: #ffebee;
            border: 1px solid #ef9a9a;
        }

        .inline-form {
            display: inline;
            margin-left: 5px;
        }

        .empty-message {
            padding: 25px;
            text-align: center;
            color: #777;
        }
    </style>
</head>

<body>

<div class="container">

    <!-- 页面标题和当前登录用户 -->
    <div class="header">
        <h1>用户管理列表</h1>

        <div class="login-info">
            <span>
                当前用户：
                <strong th:text="${loginUsername}">
                    未登录
                </strong>
            </span>

            <!-- 退出登录 -->
            <form th:action="@{/logout}"
                  method="post">
                <button type="submit"
                        class="button logout-button">
                    退出登录
                </button>
            </form>
        </div>
    </div>

    <!-- 操作成功提示 -->
    <div th:if="${success}"
         class="message success-message"
         th:text="${success}">
        操作成功
    </div>

    <!-- 操作失败提示 -->
    <div th:if="${error}"
         class="message error-message"
         th:text="${error}">
        操作失败
    </div>

    <!-- 用户列表 -->
    <table>
        <thead>
        <tr>
            <th>用户ID</th>
            <th>用户名</th>
            <th>操作</th>
        </tr>
        </thead>

        <tbody>

        <!-- 遍历Controller传来的list -->
        <tr th:each="user : ${list}">
            <td th:text="${user.userid}">
                1
            </td>

            <td th:text="${user.username}">
                lucky
            </td>

            <td>
                <!-- 修改入口 -->
                <a class="button edit-button"
                   th:href="@{/user/edit(userid=${user.userid})}">
                    修改
                </a>
                <a class="button add-button"
                   th:href="@{/user/add}">
                    添加
                </a>

                <!-- 删除表单 -->
                <form class="inline-form"
                      th:action="@{/user/delete}"
                      method="post"
                      onsubmit="return confirm('确定要删除这个用户吗？');">

                    <input type="hidden"
                           name="userid"
                           th:value="${user.userid}">

                    <button type="submit"
                            class="button delete-button">
                        删除
                    </button>
                </form>
            </td>
        </tr>

        <!-- 用户列表为空时显示 -->
        <tr th:if="${list == null or #lists.isEmpty(list)}">
            <td colspan="3"
                class="empty-message">
                当前没有用户数据
            </td>
        </tr>

        </tbody>
    </table>

</div>

</body>
</html>
